name: F# core and local CLI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run vendor-independent F# tests
        run: dotnet test tests/StructureSetQa.Core.Tests/StructureSetQa.Core.Tests.fsproj --configuration Release
      - name: Validate clinician rulebooks locally
        run: dotnet run --project src/StructureSetQa.Cli --configuration Release -- validate
      - name: Inventory sample structure IDs
        run: dotnet run --project src/StructureSetQa.Cli --configuration Release -- inventory samples/structure-ids.txt
      - name: Execute synthetic structure-set QA
        run: dotnet run --project src/StructureSetQa.Cli --configuration Release -- demo
