name: Core F# tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and run vendor-independent tests
        run: dotnet test tests/StructureSetQa.Core.Tests/StructureSetQa.Core.Tests.fsproj --configuration Release
